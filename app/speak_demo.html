<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flux voice test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 90px; font-size: 16px; padding: 8px; box-sizing: border-box; }
  select, button { font-size: 16px; padding: 8px 12px; margin-top: 8px; }
  button { cursor: pointer; }
  #status { margin-top: 16px; padding: 10px; background: #f3f3f3; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>Flux voice test</h2>
<p>Type text, press Speak. Uses Gemini TTS; if that is unavailable, your browser's own voice reads it.</p>
<textarea id="text">Hi Maya, you are on track with your savings goals.</textarea><br>
<select id="voice">
  <option value="">Default (Kore)</option>
  <option>Puck</option><option>Charon</option><option>Aoede</option><option>Zephyr</option>
  <option>Fenrir</option><option>Leda</option><option>Orus</option>
</select>
<button id="go">Speak</button>
<div id="status">Ready.</div>
<script>
const status = (m) => document.getElementById("status").textContent = m;
document.getElementById("go").onclick = async () => {
  const text = document.getElementById("text").value.trim();
  if (!text) return status("Type something first.");
  status("Asking Flux...");
  try {
    const body = { text };
    const voice = document.getElementById("voice").value;
    if (voice) body.voice = voice;
    const r = await fetch("/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.audio_base64) {
      status("Playing Gemini voice. source: " + d.source);
      await new Audio("data:" + d.mime_type + ";base64," + d.audio_base64).play();
    } else {
      status("Gemini TTS unavailable, using the browser voice.\nsource: " + d.source + "\nreason: " + d.reason +
             (d.errors ? "\nerrors: " + d.errors.join(" | ") : ""));
      speechSynthesis.speak(new SpeechSynthesisUtterance(d.text));
    }
  } catch (e) { status("Request failed: " + e); }
};
</script>
</body>
</html>
